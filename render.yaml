services:
  - type: web
    name: makrana-home-art
    runtime: node
    plan: starter
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: PORT
        value: "10000"
      - key: VITE_SITE_URL
        value: https://makranahomeart.com
      - key: PUBLIC_SITE_URL
        value: https://makranahomeart.com
      - key: NEXT_PUBLIC_SITE_URL
        value: https://makranahomeart.com
      - key: APP_URL
        value: https://makranahomeart.com
      - key: SITE_URL
        value: https://makranahomeart.com
      - key: VITE_APP_NAME
        value: Makrana Home Art
      - key: VITE_APP_ENV
        value: production
      - key: VITE_ENABLE_DEV_ADMIN
        value: "false"
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: VITE_SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: WHATSAPP_BUSINESS_PHONE_NUMBER_ID
        sync: false
      - key: WHATSAPP_BUSINESS_ACCESS_TOKEN
        sync: false
      - key: WHATSAPP_BUSINESS_API_VERSION
        value: v23.0
      - key: WHATSAPP_BUSINESS_FROM_NUMBER
        sync: false
